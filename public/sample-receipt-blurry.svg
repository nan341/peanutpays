<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f3f4f6"/>
  <circle cx="100" cy="100" r="60" fill="#f87171" filter="url(#blurFilter)" />
  <circle cx="280" cy="180" r="80" fill="#60a5fa" filter="url(#blurFilter)" />
  <rect x="80" y="120" width="240" height="60" fill="#34d399" filter="url(#blurFilter)" />
  <text x="200" y="150" font-family="sans-serif" font-size="16" fill="#1f2937" filter="url(#blurFilter)" text-anchor="middle">Abstract Blurry Pattern</text>
</svg>